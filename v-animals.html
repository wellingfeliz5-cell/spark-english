<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Vocabulary</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --accent: #059669;
      --accent-hover: #047857;
      --text: #0f172a;
      --text-secondary: #64748b;
      --correct: #10b981;
      --correct-bg: #ecfdf5;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --border: #e2e8f0;
      --timer-bg: #fee2e2;
      --timer-text: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 550px;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      color: var(--text);
      font-weight: 700;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Selector de Preguntas */
    .selector-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .stepper {
      display: flex;
      align-items: center;
      background-color: #f1f5f9;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .stepper button {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      width: 50px;
      height: 50px;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .stepper button:hover {
        background-color: #e2e8f0;
      }
    }

    .stepper span {
      font-size: 1.4rem;
      font-weight: 600;
      width: 70px;
      text-align: center;
    }

    /* Botones generales */
    .btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .btn-primary:hover {
        background-color: var(--accent-hover);
      }
    }

    .btn-danger {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .btn-danger:hover {
        background-color: #fee2e2;
        color: #b91c1c;
      }
    }

    /* Interfaz de Juego */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    .progress {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .timer-badge {
      background-color: var(--timer-bg);
      color: var(--timer-text);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #fca5a5;
    }

    .word-box {
      text-align: center;
      padding: 24px 10px;
      background-color: #f8fafc;
      border-radius: 12px;
      border: 1px dashed var(--border);
    }

    .phrasal-verb {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      -webkit-tap-highlight-color: transparent;
      outline: none;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .option-btn:hover:not(:disabled) {
        border-color: var(--accent);
        background-color: #ecfdf5;
      }
    }

    .option-btn .label {
      font-weight: 700;
      color: #047857;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background-color: #d1fae5;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #065f46 !important;
      font-weight: 600;
    }

    .option-btn.correct .label {
      background-color: var(--correct);
      color: white;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #991b1b !important;
      font-weight: 600;
    }

    .option-btn.wrong .label {
      background-color: var(--wrong);
      color: white;
    }

    .option-btn.blink-red {
      animation: blinkRed 0.6s ease-in-out 2;
    }

    @keyframes blinkRed {
      0%, 100% {
        background-color: #ffffff;
        border-color: var(--border);
        color: var(--text);
      }
      50% {
        background-color: var(--wrong-bg);
        border-color: var(--wrong);
        color: #991b1b;
      }
    }

    .option-btn.blink-red .label {
      animation: blinkRedLabel 0.6s ease-in-out 2;
    }

    @keyframes blinkRedLabel {
      0%, 100% {
        background-color: #d1fae5;
        color: #047857;
      }
      50% {
        background-color: var(--wrong);
        color: white;
      }
    }

    /* Pantalla Final */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 15px 0;
    }

    .stat-card {
      background-color: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-card.correct-card { border-color: #a7f3d0; background-color: #ecfdf5; }
    .stat-card.wrong-card { border-color: #fca5a5; background-color: #fef2f2; }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .correct-card .stat-value { color: var(--correct); }
    .wrong-card .stat-value { color: var(--wrong); }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Sección Phrasal Verbs a reforzar */
    .wrong-list-container {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .wrong-item {
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .wrong-item-verb {
      font-weight: 700;
      color: #dc2626;
    }

    .wrong-item-meaning {
      color: var(--text-secondary);
      font-weight: 500;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. PANTALLA INICIAL -->
    <div id="start-screen" class="screen active">
      <h1>Animal Vocabulary!</h1>
      <p class="subtitle">✨ Aprende y pon a prueba tu vocabulario en inglés ✨</p>
      
      <div class="selector-group">
        <label style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 500;">¿Cuántas preguntas deseas responder?</label>
        <div class="stepper">
          <button id="btn-minus">-</button>
          <span id="question-count">10</span>
          <button id="btn-plus">+</button>
        </div>
      </div>

      <button id="start-btn" class="btn-primary">¡Comenzar Juego!</button>
    </div>

    <!-- 2. PANTALLA DEL JUEGO -->
    <div id="game-screen" class="screen">
      <div class="game-header">
        <span class="progress" id="progress-text">Pregunta 1 de 10</span>
        <div class="timer-badge">⏱️ <span id="timer-text">30s</span></div>
        <button id="finish-btn" class="btn-danger">Finalizar</button>
      </div>

      <div class="word-box">
        <div class="phrasal-verb" id="phrasal-verb-display">Ask for</div>
      </div>

      <div class="options-list" id="options-container">
        <!-- Las opciones a, b, c se generarán dinámicamente -->
      </div>
    </div>

    <!-- 3. PANTALLA DE RESULTADOS -->
    <div id="end-screen" class="screen">
      <h1>¡Juego Terminado!</h1>
      <p class="subtitle" id="final-status-text">Aquí tienes el resumen de tu partida:</p>

      <div class="results-grid">
        <div class="stat-card correct-card">
          <div class="stat-value" id="correct-count">0</div>
          <div class="stat-label">Correctas</div>
        </div>
        <div class="stat-card wrong-card">
          <div class="stat-value" id="wrong-count">0</div>
          <div class="stat-label">Incorrectas</div>
        </div>
      </div>

      <!-- Sección dinámicamente mostrada si existen errores -->
      <div id="review-section" style="display: none;">
        <h3 style="font-size: 1.1rem; color: var(--text); font-weight: 700; margin-bottom: 8px;">Vocabulary to reinforce:</h3>
        <div class="wrong-list-container" id="wrong-list"></div>
      </div>

      <button id="restart-btn" class="btn-primary">Jugar de nuevo</button>
    </div>
  </div>

  <script>
    // Base de datos actualizada con el listado de Animales
    const database = [
      { verb: "Alligator", meaning: "Caimán" },
      { verb: "Ant", meaning: "Hormiga" },
      { verb: "Anteater", meaning: "Oso hormiguero" },
      { verb: "Ape", meaning: "Mono antropoide" },
      { verb: "Badger", meaning: "Tejón" },
      { verb: "Bat", meaning: "Murciélago" },
      { verb: "Bear", meaning: "Oso" },
      { verb: "Bee", meaning: "Abeja" },
      { verb: "Beetle", meaning: "Escarabajo" },
      { verb: "Bird", meaning: "Pájaro" },
      { verb: "Bison", meaning: "Bisón" },
      { verb: "Boar", meaning: "Jabalí" },
      { verb: "Buffalo", meaning: "Búfalo" },
      { verb: "Butterfly", meaning: "Mariposa" },
      { verb: "Camel", meaning: "Camello" },
      { verb: "Cat", meaning: "Gato" },
      { verb: "Caterpillar", meaning: "Oruga" },
      { verb: "Cheetah", meaning: "Guepardo" },
      { verb: "Chicken", meaning: "Gallina" },
      { verb: "Chimpanzee", meaning: "Chimpancé" },
      { verb: "Cockroach", meaning: "Cucaracha" },
      { verb: "Cow", meaning: "Vaca" },
      { verb: "Crab", meaning: "Cangrejo" },
      { verb: "Crocodile", meaning: "Cocodrilo" },
      { verb: "Crow", meaning: "Cuervo" },
      { verb: "Deer", meaning: "Ciervo" },
      { verb: "Dog", meaning: "Perro" },
      { verb: "Dolphin", meaning: "Delfín" },
      { verb: "Donkey", meaning: "Burro" },
      { verb: "Duck", meaning: "Pato" },
      { verb: "Eagle", meaning: "Águila" },
      { verb: "Elephant", meaning: "Elefante" },
      { verb: "Falcon", meaning: "Halcón" },
      { verb: "Flamingo", meaning: "Flamenco" },
      { verb: "Flea", meaning: "Pulga" },
      { verb: "Fly", meaning: "Mosca" },
      { verb: "Fox", meaning: "Zorro" },
      { verb: "Frog", meaning: "Rana" },
      { verb: "Giraffe", meaning: "Jirafa" },
      { verb: "Goat", meaning: "Cabra" },
      { verb: "Goose", meaning: "Ganso" },
      { verb: "Gorilla", meaning: "Gorila" },
      { verb: "Grasshopper", meaning: "Saltamontes" },
      { verb: "Hamster", meaning: "Hámster" },
      { verb: "Hawk", meaning: "Halcón / Gavilán" },
      { verb: "Hedgehog", meaning: "Erizo" },
      { verb: "Hippopotamus", meaning: "Hipopótamo" },
      { verb: "Horse", meaning: "Caballo" },
      { verb: "Hummingbird", meaning: "Colibrí" },
      { verb: "Hyena", meaning: "Hiena" },
      { verb: "Jellyfish", meaning: "Medusa" },
      { verb: "Kangaroo", meaning: "Canguro" },
      { verb: "Koala", meaning: "Coala" },
      { verb: "Leopard", meaning: "Leopardo" },
      { verb: "Lion", meaning: "León" },
      { verb: "Lizard", meaning: "Lagarto" },
      { verb: "Lobster", meaning: "Langosta" },
      { verb: "Monkey", meaning: "Mono" },
      { verb: "Mosquito", meaning: "Mosquito" },
      { verb: "Mouse", meaning: "Ratón" },
      { verb: "Octopus", meaning: "Pulpo" },
      { verb: "Ostrich", meaning: "Avestruz" },
      { verb: "Owl", meaning: "Búho" },
      { verb: "Ox", meaning: "Buey" },
      { verb: "Parrot", meaning: "Loro" },
      { verb: "Peacock", meaning: "Pavo real" },
      { verb: "Pelican", meaning: "Pelícano" },
      { verb: "Penguin", meaning: "Pingüino" },
      { verb: "Pig", meaning: "Cerdo" },
      { verb: "Pigeon", meaning: "Paloma" },
      { verb: "Polar bear", meaning: "Oso polar" },
      { verb: "Rabbit", meaning: "Conejo" },
      { verb: "Raccoon", meaning: "Mapache" },
      { verb: "Rat", meaning: "Rata" },
      { verb: "Rhinoceros", meaning: "Rinoceronte" },
      { verb: "Rooster", meaning: "Gallo" },
      { verb: "Salmon", meaning: "Salmón" },
      { verb: "Scorpion", meaning: "Escorpión" },
      { verb: "Seahorse", meaning: "Caballito de mar" },
      { verb: "Seal", meaning: "Foca" },
      { verb: "Shark", meaning: "Tiburón" },
      { verb: "Sheep", meaning: "Oveja" },
      { verb: "Shrimp", meaning: "Camarón" },
      { verb: "Sloth", meaning: "Perezoso" },
      { verb: "Snail", meaning: "Caracol" },
      { verb: "Snake", meaning: "Serpiente" },
      { verb: "Spider", meaning: "Araña" },
      { verb: "Squid", meaning: "Calamar" },
      { verb: "Squirrel", meaning: "Ardilla" },
      { verb: "Stork", meaning: "Cigüeña" },
      { verb: "Swan", meaning: "Cisne" },
      { verb: "Tiger", meaning: "Tigre" },
      { verb: "Toad", meaning: "Sapo" },
      { verb: "Turkey", meaning: "Pavo" },
      { verb: "Turtle", meaning: "Tortuga" },
      { verb: "Vulture", meaning: "Buitre" },
      { verb: "Walrus", meaning: "Morsa" },
      { verb: "Whale", meaning: "Ballena" },
      { verb: "Wolf", meaning: "Lobo" },
      { verb: "Zebra", meaning: "Cebra" }
    ];

    // Variables de estado del juego
    let targetQuestionCount = 10;
    let selectedQuestions = [];
    let wrongQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let isAnsweringAllowed = true;
    let timerInterval = null;
    let timeLeft = 30;

    // Elementos del DOM
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');

    const questionCountDisplay = document.getElementById('question-count');
    const btnMinus = document.getElementById('btn-minus');
    const btnPlus = document.getElementById('btn-plus');
    const startBtn = document.getElementById('start-btn');
    const finishBtn = document.getElementById('finish-btn');
    const restartBtn = document.getElementById('restart-btn');

    const progressText = document.getElementById('progress-text');
    const timerText = document.getElementById('timer-text');
    const verbDisplay = document.getElementById('phrasal-verb-display');
    const optionsContainer = document.getElementById('options-container');

    const correctCountDisplay = document.getElementById('correct-count');
    const wrongCountDisplay = document.getElementById('wrong-count');
    const reviewSection = document.getElementById('review-section');
    const wrongList = document.getElementById('wrong-list');

    // Control de la cantidad de preguntas (De 5 en 5, entre 5 y 100)
    btnMinus.addEventListener('click', () => {
      if (targetQuestionCount > 5) {
        targetQuestionCount -= 5;
        questionCountDisplay.textContent = targetQuestionCount;
      }
    });

    btnPlus.addEventListener('click', () => {
      if (targetQuestionCount < 100) {
        targetQuestionCount += 5;
        questionCountDisplay.textContent = targetQuestionCount;
      }
    });

    // Iniciar Juego
    startBtn.addEventListener('click', startGame);
    finishBtn.addEventListener('click', endGame);
    restartBtn.addEventListener('click', resetToStart);

    function startGame() {
      currentIndex = 0;
      correctCount = 0;
      wrongCount = 0;
      wrongQuestions = [];

      // Seleccionar preguntas aleatorias de la base de datos
      const shuffled = [...database].sort(() => 0.5 - Math.random());
      selectedQuestions = shuffled.slice(0, targetQuestionCount);

      startScreen.classList.remove('active');
      gameScreen.classList.add('active');

      renderQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 15;
      timerText.textContent = `${timeLeft}s`;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerText.textContent = `${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function renderQuestion() {
      isAnsweringAllowed = true;
      const currentQ = selectedQuestions[currentIndex];

      progressText.textContent = `Pregunta ${currentIndex + 1} de ${selectedQuestions.length}`;
      verbDisplay.textContent = currentQ.verb;
      optionsContainer.innerHTML = '';

      // Generar 2 distractoras únicas
      const distractors = database
        .filter(item => item.verb !== currentQ.verb)
        .sort(() => 0.5 - Math.random())
        .slice(0, 2);

      // Crear las 3 opciones (A, B, C) y desordenarlas
      const optionsData = [
        { text: currentQ.meaning, isCorrect: true },
        { text: distractors[0].meaning, isCorrect: false },
        { text: distractors[1].meaning, isCorrect: false }
      ].sort(() => 0.5 - Math.random());

      const labels = ['a', 'b', 'c'];

      optionsData.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.classList.add('option-btn');
        btn.dataset.isCorrect = opt.isCorrect;

        btn.innerHTML = `
          <span class="label">${labels[idx]}</span>
          <span>${opt.text}</span>
        `;

        btn.addEventListener('click', () => handleAnswer(btn, opt.isCorrect));
        optionsContainer.appendChild(btn);
      });

      startTimer();
    }

    function handleAnswer(selectedBtn, isCorrect) {
      if (!isAnsweringAllowed) return;
      isAnsweringAllowed = false;
      clearInterval(timerInterval);

      const currentQ = selectedQuestions[currentIndex];
      const buttons = optionsContainer.querySelectorAll('.option-btn');

      if (isCorrect) {
        selectedBtn.classList.add('correct');
        correctCount++;
      } else {
        selectedBtn.classList.add('wrong');
        wrongCount++;
        wrongQuestions.push(currentQ);
        // Iluminar en verde la respuesta correcta si se respondió mal
        buttons.forEach(btn => {
          if (btn.dataset.isCorrect === 'true') {
            btn.classList.add('correct');
          }
        });
      }

      // Deshabilitar todos los botones durante la transición
      buttons.forEach(btn => btn.disabled = true);

      // Siguiente pregunta después de 1.2 segundos
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < selectedQuestions.length) {
          renderQuestion();
        } else {
          endGame();
        }
      }, 1200);
    }

    function handleTimeout() {
      if (!isAnsweringAllowed) return;
      isAnsweringAllowed = false;

      const currentQ = selectedQuestions[currentIndex];
      wrongCount++;
      wrongQuestions.push(currentQ);

      const buttons = optionsContainer.querySelectorAll('.option-btn');

      // Deshabilitar todos los botones y hacer parpadear en rojo ÚNICAMENTE la respuesta correcta
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.isCorrect === 'true') {
          btn.classList.add('blink-red');
        }
      });

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < selectedQuestions.length) {
          renderQuestion();
        } else {
          endGame();
        }
      }, 1200);
    }

    function endGame() {
      clearInterval(timerInterval);
      gameScreen.classList.remove('active');
      endScreen.classList.add('active');

      correctCountDisplay.textContent = correctCount;
      wrongCountDisplay.textContent = wrongCount;

      // Desplegar lista de Phrasal Verbs a reforzar si hubo fallos
      if (wrongQuestions.length > 0) {
        reviewSection.style.display = 'block';
        wrongList.innerHTML = wrongQuestions.map(item => `
          <div class="wrong-item">
            <span class="wrong-item-verb">${item.verb}</span>
            <span class="wrong-item-meaning">${item.meaning}</span>
          </div>
        `).join('');
      } else {
        reviewSection.style.display = 'none';
        wrongList.innerHTML = '';
      }
    }

    function resetToStart() {
      clearInterval(timerInterval);
      endScreen.classList.remove('active');
      startScreen.classList.add('active');
    }
  </script>

  <script>
  // Bloque para insertar automáticamente el nombre del juego al finalizar
  document.addEventListener("DOMContentLoaded", () => {
    const endScreen = document.getElementById("end-screen");
    const title = endScreen ? endScreen.querySelector("h1") : null;

    if (title) {
      const gameBadge = document.createElement("span");
      gameBadge.textContent = "Animal Vocabulary!"; // <-- Cambia solo este texto en cada juego
      
      // Estilos integrados directamente
      Object.assign(gameBadge.style, {
        display: "inline-block",
        alignSelf: "center",
        backgroundColor: "var(--tag-bg, #d1fae5)",
