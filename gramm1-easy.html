<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Fill - Easy Level</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --accent: #059669;
      --accent-hover: #047857;
      --text: #0f172a;
      --text-secondary: #64748b;
      --correct: #10b981;
      --correct-bg: #ecfdf5;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --border: #e2e8f0;
      --timer-bg: #fee2e2;
      --timer-text: #dc2626;
      --tag-text: #047857;
      --tag-bg: #d1fae5;
      --option-hover-bg: #ecfdf5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 550px;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      color: var(--text);
      font-weight: 700;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Selector de Preguntas */
    .selector-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .stepper {
      display: flex;
      align-items: center;
      background-color: #f1f5f9;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .stepper button {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      width: 50px;
      height: 50px;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .stepper button:hover {
        background-color: #e2e8f0;
      }
    }

    .stepper span {
      font-size: 1.4rem;
      font-weight: 600;
      width: 70px;
      text-align: center;
    }

    /* Botones generales */
    .btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .btn-primary:hover {
        background-color: var(--accent-hover);
      }
    }

    .btn-danger {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .btn-danger:hover {
        background-color: #fee2e2;
        color: #b91c1c;
      }
    }

    /* Interfaz de Juego */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    .progress {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .timer-badge {
      background-color: var(--timer-bg);
      color: var(--timer-text);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #fca5a5;
    }

    .sentence-box {
      text-align: center;
      padding: 24px 16px;
      background-color: #f8fafc;
      border-radius: 12px;
      border: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sentence-en {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.3px;
      line-height: 1.4;
    }

    .sentence-es {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-secondary);
      font-style: italic;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      -webkit-tap-highlight-color: transparent;
      outline: none;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .option-btn:hover:not(:disabled) {
        border-color: var(--accent);
        background-color: var(--option-hover-bg);
      }
    }

    .option-btn .label {
      font-weight: 700;
      color: var(--tag-text);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background-color: var(--tag-bg);
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #065f46 !important;
    }

    .option-btn.correct .label {
      background-color: var(--correct);
      color: white;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #991b1b !important;
    }

    .option-btn.wrong .label {
      background-color: var(--wrong);
      color: white;
    }

    .option-btn.blink-red {
      animation: blinkRed 0.6s ease-in-out 2;
    }

    @keyframes blinkRed {
      0%, 100% {
        background-color: #ffffff;
        border-color: var(--border);
        color: var(--text);
      }
      50% {
        background-color: var(--wrong-bg);
        border-color: var(--wrong);
        color: #991b1b;
      }
    }

    .option-btn.blink-red .label {
      animation: blinkRedLabel 0.6s ease-in-out 2;
    }

    @keyframes blinkRedLabel {
      0%, 100% {
        background-color: var(--tag-bg);
        color: var(--tag-text);
      }
      50% {
        background-color: var(--wrong);
        color: white;
      }
    }

    /* Pantalla Final */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 15px 0;
    }

    .stat-card {
      background-color: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-card.correct-card { border-color: #a7f3d0; background-color: #ecfdf5; }
    .stat-card.wrong-card { border-color: #fca5a5; background-color: #fef2f2; }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .correct-card .stat-value { color: var(--correct); }
    .wrong-card .stat-value { color: var(--wrong); }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .wrong-list-container {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .wrong-item {
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
    }

    .wrong-item-sentence {
      font-weight: 700;
      color: #dc2626;
    }

    .wrong-item-translation {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">

    <div id="start-screen" class="screen active">

      <button id="start-btn" class="btn-primary">¡Comenzar Juego!</button>
    </div>

    <!-- 2. PANTALLA DEL JUEGO -->

        <button id="finish-btn" class="btn-danger">Finalizar</button>

      <div class="sentence-box">
        <div class="sentence-en" id="sentence-en-display">...</div>
        <div class="sentence-es" id="sentence-es-display">...</div>
      </div>

      <div class="options-list" id="options-container"></div>
    </div>

    <!-- 3. PANTALLA DE RESULTADOS -->
    <div id="end-screen" class="screen">
      <h1>¡Juego Terminado!</h1>
      <p class="subtitle" id="final-status-text">Aquí tienes el resumen de tu partida:</p>

      <div class="results-grid">
        <div class="stat-card correct-card">
          <div class="stat-value" id="correct-count">0</div>
          <div class="stat-label">Correctas</div>
        </div>
        <div class="stat-card wrong-card">
          <div class="stat-value" id="wrong-count">0</div>
          <div class="stat-label">Incorrectas</div>

        <div class="wrong-list-container" id="wrong-list"></div>
      </div>

      <button id="restart-btn" class="btn-primary">Jugar de nuevo</button>
    </div>
  </div>

      { en: "We must leave early tomorrow morning.", es: "Debemos salir temprano mañana por la mañana.", ans: "must", opts: ["must", "can", "should"] },
      { en: "He fixed the broken wooden chair.", es: "Él arregló la silla de madera rota.", ans: "broken", opts: ["broken", "break", "broke"] },
      { en: "The sky looks clear and dark tonight.", es: "El cielo se ve claro y oscuro esta noche.", ans: "clear", opts: ["clear", "clears", "cleared"] },
      { en: "I try to eat healthy food daily.", es: "Intento comer comida saludable a diario.", ans: "healthy", opts: ["healthy", "health", "healthier"] },
      { en: "She meets her friends every Friday.", es: "Ella se reúne con sus amigos todos los viernes.", ans: "meets", opts: ["meets", "meet", "meeting"] },
      { en: "They are building a new shopping mall.", es: "Ellos están construyendo un nuevo centro comercial.", ans: "building", opts: ["building", "build", "builds"] },
      { en: "He returned the book to the library.", es: "Él devolvió el libro a la biblioteca.", ans: "returned", opts: ["returned", "return", "returning"] },
      { en: "I need some help with this task.", es: "Necesito algo de ayuda con esta tarea.", ans: "task", opts: ["task", "talk", "take"] },
      { en: "She takes the dog for a walk.", es: "Ella saca al perro a pasear.", ans: "walk", opts: ["walk", "walks", "walking"] },
      { en: "We enjoy listening to podcasts together.", es: "Disfrutamos escuchando podcasts juntos.", ans: "together", opts: ["together", "to", "gether"] },
      { en: "He bought a new pair of shoes.", es: "Él compró un nuevo par de zapatos.", ans: "shoes", opts: ["shoes", "shoe", "show"] },
      { en: "The lesson was easy to understand.", es: "La lección fue fácil de entender.", ans: "easy", opts: ["easy", "easily", "easier"] },
      { en: "I usually drink milk with breakfast.", es: "Normalmente bebo leche con el desayuno.", ans: "breakfast", opts: ["breakfast", "break", "fast"] },
      { en: "She is sitting near the entrance door.", es: "Ella está sentada cerca de la puerta de entrada.", ans: "entrance", opts: ["entrance", "enter", "entered"] },
      { en: "They traveled to Paris last spring.", es: "Ellos viajaron a París la primavera pasada.", ans: "spring", opts: ["spring", "summer", "winter"] },
      { en: "He forgot to pack his toothbrush.", es: "Él olvidó empacar su cepillo de dientes.", ans: "pack", opts: ["pack", "packs", "packed"] },
      { en: "We are very excited about the news.", es: "Estamos muy emocionados por la noticia.", ans: "excited", opts: ["excited", "exciting", "excite"] },
      { en: "Practice makes perfect in learning languages.", es: "La práctica hace al maestro en el aprendizaje de idiomas.", ans: "makes", opts: ["makes", "make", "made"] }
    ];

    // Mapeo automático para generar espacios en blanco
    const database = rawData.map(item => {
      // Reemplaza la palabra respetando mayúsculas/minúsculas básicas o palabras exactas
      const regex = new RegExp(`\\b${item.ans}\\b`, 'i');
      const sentenceBlank = item.en.replace(regex, "_____");
      return {
        sentence: sentenceBlank,
        translation: item.es,
        answer: item.ans,
        options: item.opts
      };
    });

    // Variables de estado
    let targetQuestionCount = 10;
    let selectedQuestions = [];
    let wrongQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let isAnsweringAllowed = true;
    let timerInterval = null;
    let timeLeft = TIMER_DEFAULT;

    // Elementos DOM
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');

    const questionCountDisplay = document.getElementById('question-count');
    const btnMinus = document.getElementById('btn-minus');
    const btnPlus = document.getElementById('btn-plus');
    const startBtn = document.getElementById('start-btn');
    const finishBtn = document.getElementById('finish-btn');
    const restartBtn = document.getElementById('restart-btn');

    const progressText = document.getElementById('progress-text');
    const timerText = document.getElementById('timer-text');
    const sentenceEnDisplay = document.getElementById('sentence-en-display');
    const sentenceEsDisplay = document.getElementById('sentence-es-display');
    const optionsContainer = document.getElementById('options-container');

    const correctCountDisplay = document.getElementById('correct-count');
    const wrongCountDisplay = document.getElementById('wrong-count');
    const reviewSection = document.getElementById('review-section');
    const wrongList = document.getElementById('wrong-list');

    // Stepper de selección
    btnMinus.addEventListener('click', () => {
      if (targetQuestionCount > 5) {
        targetQuestionCount -= 5;
        questionCountDisplay.textContent = targetQuestionCount;
      }
    });

    btnPlus.addEventListener('click', () => {
      if (targetQuestionCount < 100) {
        targetQuestionCount += 5;
        questionCountDisplay.textContent = targetQuestionCount;
      }
    });

    startBtn.addEventListener('click', startGame);
    finishBtn.addEventListener('click', endGame);
    restartBtn.addEventListener('click', resetToStart);

    function startGame() {
      currentIndex = 0;
      correctCount = 0;
      wrongCount = 0;
      wrongQuestions = [];

      const shuffled = [...database].sort(() => 0.5 - Math.random());
      selectedQuestions = shuffled.slice(0, Math.min(targetQuestionCount, database.length));

      startScreen.classList.remove('active');
      gameScreen.classList.add('active');

      renderQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TIMER_DEFAULT;
      timerText.textContent = `${timeLeft}s`;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerText.textContent = `${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function renderQuestion() {
      isAnsweringAllowed = true;
      const currentQ = selectedQuestions[currentIndex];

      progressText.textContent = `Pregunta ${currentIndex + 1} de ${selectedQuestions.length}`;
      sentenceEnDisplay.textContent = currentQ.sentence;
      sentenceEsDisplay.textContent = currentQ.translation;
      optionsContainer.innerHTML = '';

      const shuffledOptions = [...currentQ.options].sort(() => 0.5 - Math.random());
      const labels = ['a', 'b', 'c'];

      shuffledOptions.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.classList.add('option-btn');
        const isCorrect = optText.toLowerCase() === currentQ.answer.toLowerCase();
        btn.dataset.isCorrect = isCorrect;

        btn.innerHTML = `
          <span class="label">${labels[idx]}</span>
          <span>${optText}</span>
        `;

        btn.addEventListener('click', () => handleAnswer(btn, isCorrect));
        optionsContainer.appendChild(btn);
      });

      startTimer();
    }

    function handleAnswer(selectedBtn, isCorrect) {
      if (!isAnsweringAllowed) return;
      isAnsweringAllowed = false;
      clearInterval(timerInterval);

      const currentQ = selectedQuestions[currentIndex];
      const buttons = optionsContainer.querySelectorAll('.option-btn');

      if (isCorrect) {
        selectedBtn.classList.add('correct');
        correctCount++;
        sentenceEnDisplay.textContent = currentQ.sentence.replace("_____", currentQ.answer);
      } else {
        selectedBtn.classList.add('wrong');
        wrongCount++;
        wrongQuestions.push(currentQ);

        buttons.forEach(btn => {
          if (btn.dataset.isCorrect === 'true') {
            btn.classList.add('correct');
          }
        });
      }

      buttons.forEach(btn => btn.disabled = true);

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < selectedQuestions.length) {
          renderQuestion();
        } else {
          endGame();
        }
      }, 1200);
    }

    function handleTimeout() {
      if (!isAnsweringAllowed) return;
      isAnsweringAllowed = false;

      const currentQ = selectedQuestions[currentIndex];
      wrongCount++;
      wrongQuestions.push(currentQ);

      const buttons = optionsContainer.querySelectorAll('.option-btn');

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.isCorrect === 'true') {
          btn.classList.add('blink-red');
        }
      });

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < selectedQuestions.length) {
          renderQuestion();
        } else {
          endGame();
        }
      }, 1200);
    }

    function endGame() {
      clearInterval(timerInterval);
      gameScreen.classList.remove('active');
      endScreen.classList.add('active');

      correctCountDisplay.textContent = correctCount;
      wrongCountDisplay.textContent = wrongCount;

      if (wrongQuestions.length > 0) {
        reviewSection.style.display = 'block';
        wrongList.innerHTML = wrongQuestions.map(item => `
          <div class="wrong-item">
            <span class="wrong-item-sentence">${item.sentence.replace("_____", `[${item.answer}]`)}</span>
            <span class="wrong-item-translation">${item.translation}</span>
          </div>
        `).join('');
      } else {
        reviewSection.style.display = 'none';
        wrongList.innerHTML = '';
      }
    }

    function resetToStart() {
      clearInterval(timerInterval);
      endScreen.classList.remove('active');
      startScreen.classList.add('active');
    }
  </script>

  <!-- Auto-etiqueta final -->
  <script>

      const endScreen = document.getElementById("end-screen");

        const gameBadge = document.createElement("span");

  <!-- Captura y Compartir -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const endScreen = document.getElementById("end-screen");
      const restartBtn = document.getElementById("restart-btn");

      if (endScreen && restartBtn) {
        const shareBtn = document.createElement("button");
        shareBtn.textContent = "📸 Guardar / Compartir";
        shareBtn.className = "btn-primary";
        
        Object.assign(shareBtn.style, {
          backgroundColor: "#2563eb",
          marginTop: "10px"
        });

        restartBtn.parentNode.insertBefore(shareBtn, restartBtn);

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        shareBtn.addEventListener("click", async () => {
          shareBtn.style.display = "none";
          restartBtn.style.display = "none";

          try {
            const canvas = await html2canvas(document.querySelector(".container"), {
              scale: 2,
              backgroundColor: "#ffffff",
              useCORS: true
            });

            shareBtn.style.display = "block";
            restartBtn.style.display = "block";

            if (isMobile && navigator.share && navigator.canShare) {
              canvas.toBlob(async (blob) => {
                if (!blob) throw new Error("No se pudo generar el blob");
                const file = new File([blob], "mi-resultado.png", { type: "image/png" });

                if (navigator.canShare({ files: [file] })) {
                  await navigator.share({
                    title: "¡Mi resultado!",
                    text: "¡Mira cómo me fue en el juego!",
                    files: [file]
                  });
                  return;
                }
                downloadImage(canvas);
              }, "image/png");
            } else {
              downloadImage(canvas);
            }
          } catch (err) {
            shareBtn.style.display = "block";
            restartBtn.style.display = "block";
            console.error("Error al procesar captura:", err);
            alert("Ocurrió un error al generar la imagen.");
          }
        });

        function downloadImage(canvas) {
          const imageURI = canvas.toDataURL("image/png");
          const link = document.createElement("a");
          link.download = "mi-resultado.png";
          link.href = imageURI;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      }
    });
  </script>
</body>
