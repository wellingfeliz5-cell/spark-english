<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento en curso</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Contenedor del reloj */
    .clock-container {
      position: relative;
      width: 80px;
      height: 80px;
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }

    /* Agujas del reloj */
    .hand {
      position: absolute;
      background-color: var(--accent);
      border-radius: 4px;
      transform-origin: bottom center;
    }

    .hand.hour {
      width: 4px;
      height: 22px;
      top: 18px;
      animation: rotateHand 12s linear infinite;
    }

    .hand.minute {
      width: 3px;
      height: 30px;
      top: 10px;
      animation: rotateHand 1.5s linear infinite;
    }

    .center-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      z-index: 2;
    }

    @keyframes rotateHand {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Badge de estado */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Barra de progreso decorativa */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 40%;
      background-color: var(--accent);
      border-radius: 10px;
      animation: moveProgress 2.5s ease-in-out infinite alternate;
    }

    @keyframes moveProgress {
      0% { width: 15%; margin-left: 0%; }
      100% { width: 35%; margin-left: 65%; }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Reloj animado -->
    <div class="clock-container">
      <div class="hand hour"></div>
      <div class="hand minute"></div>
      <div class="center-dot"></div>
    </div>

    <!-- Indicador pulsante -->
    <div class="badge">
      <span class="pulse-dot"></span>
      <span>Ajustes en proceso</span>
    </div>

    <h1>Estamos en mantenimiento</h1>
    
    <p>Estamos realizando unos ajustes rápidos para mejorar tu experiencia. Por favor, danos unos minutos y regresa en breve.</p>

    <!-- Barra de estado activa -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

</body>
</html>
